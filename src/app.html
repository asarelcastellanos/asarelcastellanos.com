<!doctype html>
<html lang="en" class="dark" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Dark is the default. The script below updates this for the light theme. -->
		<meta name="theme-color" content="#090b0a" />
		%sveltekit.head%
		<script>
			// Placed after the stylesheet links so --background is readable. Runs before first paint so the page never flashes the wrong theme.
			// Order: stored choice, then the system setting, then dark.
			(function () {
				var theme = null;
				try {
					var stored = localStorage.getItem('theme');
					if (stored === 'light' || stored === 'dark') theme = stored;
				} catch (error) {
					// Storage can be blocked. Fall through to the system setting.
				}
				if (theme === null) {
					theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				}
				var root = document.documentElement;
				root.classList.toggle('dark', theme === 'dark');
				root.dataset.theme = theme;
				var background = getComputedStyle(root).getPropertyValue('--background').trim();
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta && background) meta.setAttribute('content', background);
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
