<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Light is the default. The script below updates this for the dark theme. -->
		<meta name="theme-color" content="#e7e8e4" />
		%sveltekit.head%
		<script>
			// Placed after the stylesheet links so --background is readable. Runs before first paint so the page never flashes the wrong theme.
			// A stored "light" or "dark" wins. Otherwise the preference is "system" and the OS setting decides.
			// src/lib/theme.ts keeps the same rules and storage key, and follows later OS changes.
			(function () {
				var preference = 'system';
				try {
					var stored = localStorage.getItem('theme');
					if (stored === 'light' || stored === 'dark') preference = stored;
				} catch (error) {
					// Storage can be blocked. Fall through to the system setting.
				}
				var theme = preference;
				if (preference === 'system') {
					theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				var root = document.documentElement;
				root.classList.toggle('dark', theme === 'dark');
				root.dataset.theme = theme;
				root.dataset.themePreference = preference;
				var background = getComputedStyle(root).getPropertyValue('--background').trim();
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta && background) meta.setAttribute('content', background);
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
